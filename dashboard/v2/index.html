<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111216">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabi">
  <meta name="description" content="Sabi — sports intelligence, history, performance and journal.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/assets/app.css">
  <title>Sabi</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/icon.svg" alt="">
        <div>
          <strong>Sabi</strong>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="/" data-route="overview"><span class="nav-icon">⌂</span><span>Overview</span></a>
        <a href="/picks" data-route="picks"><span class="nav-icon">✓</span><span>Games / Picks</span></a>
        <a href="/tickets" data-route="tickets"><span class="nav-icon">▤</span><span>Tickets</span></a>
        <a href="/performance" data-route="performance"><span class="nav-icon">↗</span><span>Performance</span></a>
        <a href="/finance" data-route="finance"><span class="nav-icon">₦</span><span>Finance</span></a>
        <a href="/strategies" data-route="strategies"><span class="nav-icon">◎</span><span>Strategies</span></a>
        <a href="/history" data-route="history"><span class="nav-icon">◷</span><span>History</span></a>
        <a href="/blog" data-route="blog"><span class="nav-icon">✎</span><span>Sabi Blog</span></a>
        <a href="/system" data-route="system"><span class="nav-icon">◉</span><span>System</span></a>
      </nav>

      <div class="sidebar-foot">
        <div class="online-pill"><span></span> Online</div>
        <small>Research and ticket work happen with Sabi in OpenClaw.</small>
      </div>
    </aside>

    <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="icon-button menu-button" aria-label="Open navigation">☰</button>
        <div class="page-heading">
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="topbar-actions">
          <span id="network-status" class="network-status" aria-live="polite"></span>
          <div id="readiness-chip" class="status-chip loading"><span></span><b>Checking</b></div>
          <button id="notification-button" class="icon-button notification-button" title="Enable result notifications" aria-label="Enable result notifications" aria-pressed="false" data-notification-state="off"><svg class="notification-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-9.33-5M6.26 6.26A5.9 5.9 0 0 0 6 8c0 7-3 7-3 9h14M13.73 21a2 2 0 0 1-3.46 0M3 3l18 18"/></svg></button>
          <button id="install-button" class="icon-button" title="Install Sabi" aria-label="Install Sabi">↓</button>
          <button id="refresh-button" class="icon-button" title="Refresh data" aria-label="Refresh data">↻</button>
        </div>
      </header>

      <main id="view" class="view" aria-live="polite">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading our record…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
  <script src="/assets/history_insights.js" defer></script>
</body>
</html>
